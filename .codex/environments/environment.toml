version = 1
name = "local"

[setup]
script = """
set -euo pipefail

src="${CODEX_SOURCE_TREE_PATH:?}"
dst="${CODEX_WORKTREE_PATH:?}"

copy_if_exists() {
  from="$src/$1"
  to="$dst/$1"

  if [ -e "$from" ] && [ ! -e "$to" ]; then
    mkdir -p "$(dirname "$to")"
    cp -Rc "$from" "$to"
  fi
}

copy_if_exists ".env"
copy_if_exists ".env.local"
copy_if_exists ".env.test"
copy_if_exists ".env.test.local"

copy_if_exists "deps"
copy_if_exists "_build"
copy_if_exists "assets/node_modules"
copy_if_exists "assets/vendor"
"""
