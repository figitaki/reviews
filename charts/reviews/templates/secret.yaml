{{- if not .Values.secrets.existingSecret }}
{{- $name := include "reviews.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "reviews.labels" . | nindent 4 }}
type: Opaque
data:
  # Generated on install and read back on upgrade, so sessions survive.
  SECRET_KEY_BASE: {{ $existing.SECRET_KEY_BASE | default (randAlphaNum 64 | b64enc) }}
  RELEASE_COOKIE: {{ $existing.RELEASE_COOKIE | default (randAlphaNum 48 | b64enc) }}
{{- end }}
