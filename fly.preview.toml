# Fly config for per-PR preview apps (reviews-pr-<N>). Used only by
# .github/workflows/fly-review.yml, which passes --app, so `app` below is
# a placeholder. Production uses fly.toml.
#
# All preview apps connect to one preview Postgres server, and its pooler
# limits how many client connections it accepts (max_client_conn). This
# file keeps each preview's share small. See "Connection budget" in
# docs/PREVIEW_ENVS.md before you change the values below. Keep the
# other settings (release_command, port, vm) the same as fly.toml.

app = 'reviews-pr-placeholder'
primary_region = 'sjc'
kill_signal = 'SIGTERM'

[build]

[deploy]
  release_command = '/app/bin/migrate'

[env]
  PORT = '8080'
  # Ecto pool of each running preview machine. Prod uses the default (10).
  POOL_SIZE = '2'

[http_service]
  internal_port = 8080
  force_https = true
  # A stopped machine holds no database connections. Fly stops an idle
  # machine and starts it again on the next request.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
