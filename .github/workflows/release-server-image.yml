name: Release Server Image

on:
  push:
    tags:
      - "server-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish server image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate server version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#server-v}"
          mix_version="$(sed -n 's/.*version: "\([^"]*\)".*/\1/p' mix.exs | head -n 1)"
          if [ "$version" != "$mix_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mix.exs version $mix_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Compute image metadata
        id: image
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reviews-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image_name }}:server-v${{ env.version }}
            ${{ steps.image.outputs.image_name }}:${{ env.version }}
            ${{ steps.image.outputs.image_name }}:sha-${{ steps.image.outputs.short_sha }}
